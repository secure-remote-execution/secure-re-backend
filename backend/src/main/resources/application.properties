spring.application.name=secure-product-challenge

# --- Servidor ---
# Puerto 8080, pensado para correr detrás de un reverse proxy Nginx (Lab 4/entrega final).
server.port=8080

# --- Datasource (PostgreSQL) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/secure_product_challenge}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:spc_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:spc_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# El esquema lo controla Flyway. NUNCA ddl-auto=update en este proyecto.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- CORS (solo frontend de desarrollo) ---
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}

# --- springdoc-openapi / Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- Logging ---
logging.level.com.eci.secureproductchallenge=INFO
logging.level.com.eci.secureproductchallenge.access=INFO
