server:
  port: 8081

spring:
  application:
    name: secure-product-challenge-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/secure_product_challenge}
    username: ${DB_USER:spc_user}
    password: ${DB_PASSWORD:spc_password}

  jpa:
    hibernate:
      ddl-auto: validate   # nunca 'update' ni 'create' - las tablas viven en Flyway
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    APP_ACCESS: INFO
