server:
  port: 8081
  # Nginx está delante en HTTPS y nos manda X-Forwarded-Proto; sin esto Spring
  # ve la conexión como HTTP plano (habla con nginx por http://localhost:8081)
  # y el HstsHeaderWriter de Spring Security nunca se activa (requiere
  # request.isSecure()=true). Hallazgo F-07, validado con ZAP + curl manual.
  forward-headers-strategy: framework

spring:
  application:
    name: secure-product-challenge-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/secure_product_challenge}
    username: ${DB_USER:spc_user}
    password: ${DB_PASSWORD:spc_password}

  jpa:
    hibernate:
      ddl-auto: validate   # nunca 'update' ni 'create' - las tablas viven en Flyway
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    # Sin valor por defecto a propósito (F-01): si falta JWT_SECRET la app no arranca.
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  seed:
    # Contraseñas de los usuarios de laboratorio; se re-hashean al arrancar y
    # reemplazan los hashes sembrados por V2 (F-01).
    admin-password: ${LAB_ADMIN_PASSWORD}
    viewer-password: ${LAB_VIEWER_PASSWORD}
  cors:
    # Lista separada por comas. Agrega aquí el origen real del navegador si accedes
    # por IP/dominio a través de Nginx (ej. https://10.239.28.54), o cambia por env var.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://10.239.28.54}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    APP_ACCESS: INFO
