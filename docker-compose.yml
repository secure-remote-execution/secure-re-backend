services:
  postgres:
    image: postgres:16-alpine
    container_name: spc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: secure_product_challenge
      POSTGRES_USER: spc_user
      POSTGRES_PASSWORD: spc_password
    ports:
      - "5432:5432"
    volumes:
      - spc_pgdata:/var/lib/postgresql/data

volumes:
  spc_pgdata:
