services:
  postgres:
    image: postgres:16-alpine
    container_name: spc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secure_product_challenge}
      POSTGRES_USER: ${POSTGRES_USER:-spc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spc_password}
    ports:
      - "5432:5432"
    volumes:
      - spc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spc_user} -d ${POSTGRES_DB:-secure_product_challenge}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  spc_postgres_data:
